<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #eeeeee;
      color: #222;
      overflow: hidden;
    }

    /* Main background */
    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #eeeeee;
      padding: 20px;
    }

    /* Neumorphic circle/container */
    .signup-wrapper {
      width: 430px;
      height: 430px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;

      background: #eeeeee;

      box-shadow:
        20px 20px 45px rgba(0, 0, 0, 0.13),
        -20px -20px 45px rgba(255, 255, 255, 0.95);

      position: relative;
    }

    .signup-wrapper::before {
      content: "";
      position: absolute;
      width: 88%;
      height: 88%;
      border-radius: 50%;

      box-shadow:
        inset 12px 12px 25px rgba(0, 0, 0, 0.08),
        inset -12px -12px 25px rgba(255, 255, 255, 0.9);

      pointer-events: none;
    }

    /* Form */
    .signup-form {
      width: 300px;
      z-index: 2;
      text-align: center;
    }

    .signup-form h1 {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }

    .subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 28px;
    }

    /* Input boxes */
    .input-box {
      position: relative;
      width: 100%;
      margin-bottom: 14px;
    }

    .input-box span {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 17px;
      color: #777;
      pointer-events: none;
    }

    .input-box input {
      width: 100%;
      height: 48px;
      border: none;
      outline: none;
      border-radius: 12px;

      background: #eeeeee;

      padding: 0 16px 0 48px;

      font-size: 14px;
      color: #333;

      box-shadow:
        inset 5px 5px 10px rgba(0, 0, 0, 0.08),
        inset -5px -5px 10px rgba(255, 255, 255, 0.9);

      transition: 0.3s ease;
    }

    .input-box input:focus {
      box-shadow:
        inset 3px 3px 7px rgba(0, 0, 0, 0.1),
        inset -3px -3px 7px rgba(255, 255, 255, 0.9),
        0 0 0 2px rgba(80, 80, 80, 0.08);
    }

    .input-box input::placeholder {
      color: #999;
    }

    /* Button */
    .create-btn {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 12px;

      background: #eeeeee;
      color: #444;

      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;

      cursor: pointer;

      box-shadow:
        7px 7px 15px rgba(0, 0, 0, 0.12),
        -7px -7px 15px rgba(255, 255, 255, 0.95);

      transition: 0.2s ease;
      margin-top: 8px;
    }

    .create-btn:hover {
      transform: translateY(-2px);
    }

    .create-btn:active {
      transform: translateY(2px);

      box-shadow:
        inset 5px 5px 10px rgba(0, 0, 0, 0.1),
        inset -5px -5px 10px rgba(255, 255, 255, 0.9);
    }

    /* Login text */
    .login-text {
      margin-top: 22px;
      font-size: 13px;
      color: #888;
    }

    .login-text a {
      color: #333;
      text-decoration: none;
      font-weight: 700;
      margin-left: 3px;
    }

    .login-text a:hover {
      text-decoration: underline;
    }

    /* Success message */
    .message {
      display: none;
      margin-top: 15px;
      font-size: 13px;
      color: #555;
    }

    /* Mobile */
    @media (max-width: 500px) {
      .signup-wrapper {
        width: 360px;
        height: 360px;
      }

      .signup-form {
        width: 250px;
      }

      .signup-form h1 {
        font-size: 29px;
      }

      .subtitle {
        margin-bottom: 20px;
      }

      .input-box input,
      .create-btn {
        height: 43px;
      }
    }

    @media (max-width: 380px) {
      .signup-wrapper {
        width: 330px;
        height: 330px;
      }

      .signup-form {
        width: 225px;
      }

      .signup-form h1 {
        font-size: 27px;
      }

      .input-box {
        margin-bottom: 10px;
      }

      .login-text {
        margin-top: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="signup-wrapper">

      <form class="signup-form" id="signupForm">

        <h1>Sign Up</h1>

        <p class="subtitle">
          Create your account
        </p>

        <!-- Full Name -->
        <div class="input-box">
          <span>👤</span>
          <input
            type="text"
            id="name"
            placeholder="Full name"
            required
          />
        </div>

        <!-- Email -->
        <div class="input-box">
          <span>✉</span>
          <input
            type="email"
            id="email"
            placeholder="Email"
            required
          />
        </div>

        <!-- Password -->
        <div class="input-box">
          <span>🔒</span>
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
            minlength="6"
          />
        </div>

        <!-- Button -->
        <button type="submit" class="create-btn">
          CREATE ACCOUNT
        </button>

        <!-- Login -->
        <p class="login-text">
          Already have an account?
          <a href="#" onclick="login()">Login</a>
        </p>

        <p class="message" id="message">
          Account created successfully!
        </p>

      </form>

    </div>

  </div>


  <script>
    const form = document.getElementById("signupForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if (!name || !email || !password) {
        alert("Please fill all fields.");
        return;
      }

      if (password.length < 6) {
        alert("Password must contain at least 6 characters.");
        return;
      }

      message.style.display = "block";

      console.log("Name:", name);
      console.log("Email:", email);
      console.log("Password:", password);

      // Clear form
      form.reset();
    });

    function login() {
      alert("Login page can be connected here.");
    }
  </script>

</body>
</html>
